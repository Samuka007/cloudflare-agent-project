name: ci

on:
  push:
  pull_request:

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive
      - uses: pnpm/action-setup@v4
        with:
          version: 10
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      # The composed unit serves the real bb SPA (#31): stage the pinned
      # submodule into apps/server-worker/public before the L1 suites run.
      # scripts/stage-bb-spa.sh is the single source for the staged SPA set —
      # the CD workflow and `nix run .#staging-deploy` run the same script, so
      # the set CI tests cannot drift from the set staging serves (#175).
      - name: Stage bb SPA (pinned submodule)
        run: ./scripts/stage-bb-spa.sh
      - run: pnpm lint
      - run: pnpm typecheck
      - run: pnpm test
      # T5' (#128): the vendored omp runtime executes only under Bun — the
      # five-tool acceptance (native gate + dispatch adapter) is a Bun-only
      # suite the Workers vitest run excludes.
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1
      - run: pnpm --dir packages/daemon-service test:runtime
      # Matrix C2 (#327): the official MCP client conformance suite against
      # the vendored @cap/mcp client — Bun runs the TS runner/client directly;
      # the pinned upstream suite is fetched via npx (network, install
      # scripts disabled) and compared against conformance/baseline.json.
      - run: pnpm --dir packages/mcp test:conformance
