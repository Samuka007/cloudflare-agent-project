name: project-board-sync

# Keep Project #5 in sync with milestone-carrying issues:
# membership (must be on the board) + Status (Todo when open, Done when closed).
# Milestone-less issues stay off the board by design (backlog).
on:
  issues:
    types: [opened, reopened, closed, milestoned]

# Serialize per-issue so close cannot race ahead of an in-flight open/milestone event.
concurrency:
  group: project-board-sync-${{ github.event.issue.number }}
  cancel-in-progress: false

jobs:
  sync:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Sync issue to Project #5
        uses: actions/github-script@v7
        with:
          # Classic PAT with project + repo scopes (repo secret PROJECT_TOKEN).
          # GITHUB_TOKEN cannot write user-owned Projects.
          github-token: ${{ secrets.PROJECT_TOKEN }}
          script: |
            // Project #5 of user Samuka007 — GraphQL id, verified 2026-10-03.
            // Hardcoded (not looked up by owner/number) so a project rename cannot break routing.
            const PROJECT_ID = 'PVT_kwHOAvgCqs4Blk19';

            const { issue } = context.payload;
            if (!issue.milestone) {
              core.info(`Issue #${issue.number} has no milestone; staying off the board.`);
              return;
            }

            const desiredState = issue.state === 'closed' ? 'Done' : 'Todo';

            // Resolve the Status single-select field + its option ids at runtime.
            const { node: project } = await github.graphql(
              `query($id: ID!) {
                node(id: $id) {
                  ... on ProjectV2 {
                    field(name: "Status") {
                      ... on ProjectV2SingleSelectField {
                        id
                        options { id name }
                      }
                    }
                  }
                }
              }`,
              { id: PROJECT_ID },
            );
            const statusField = project.field;
            if (!statusField) throw new Error('Status field not found on project');
            const option = statusField.options.find((o) => o.name === desiredState);
            if (!option) throw new Error(`Status option "${desiredState}" not found on project`);

            // Reuse the existing item when the issue is already on the board.
            const { repository } = await github.graphql(
              `query($owner: String!, $repo: String!, $number: Int!) {
                repository(owner: $owner, name: $repo) {
                  issue(number: $number) {
                    projectItems(first: 100) {
                      nodes { id project { id } }
                    }
                  }
                }
              }`,
              {
                owner: context.repo.owner,
                repo: context.repo.repo,
                number: issue.number,
              },
            );
            let itemId = repository.issue.projectItems.nodes.find(
              (n) => n.project.id === PROJECT_ID,
            )?.id;

            if (itemId) {
              core.info(`Issue #${issue.number} already on project as item ${itemId}`);
            } else {
              const { addProjectV2ItemById } = await github.graphql(
                `mutation($projectId: ID!, $contentId: ID!) {
                  addProjectV2ItemById(input: { projectId: $projectId, contentId: $contentId }) {
                    item { id }
                  }
                }`,
                { projectId: PROJECT_ID, contentId: issue.node_id },
              );
              itemId = addProjectV2ItemById.item.id;
              core.info(`Added issue #${issue.number} to project as item ${itemId}`);
            }

            await github.graphql(
              `mutation($projectId: ID!, $itemId: ID!, $fieldId: ID!, $optionId: String!) {
                updateProjectV2ItemFieldValue(
                  input: {
                    projectId: $projectId
                    itemId: $itemId
                    fieldId: $fieldId
                    value: { singleSelectOptionId: $optionId }
                  }
                ) {
                  projectV2Item { id }
                }
              }`,
              {
                projectId: PROJECT_ID,
                itemId,
                fieldId: statusField.id,
                optionId: option.id,
              },
            );
            core.info(`Set Status=${desiredState} for issue #${issue.number}`);
