name: project-board-sync

# Keep Project #5 in sync with issue lifecycle (Linear mapping,
# docs/research/tracker-structure-linear-mapping.md):
# membership (every issue boards) + Status
# (Backlog when milestone-less, Todo when milestoned+open,
#  Done when closed, Canceled when closed+wontfix)
# + Priority mirror: priority:* label → board field (labels drive, field mirrors).
# labeled/unlabeled 仅影响 ready-for-human（→ Wait for user）；
# 其余 label 事件幂等重算，成本可忽略。
on:
  issues:
    types: [opened, reopened, closed, milestoned, demilestoned, labeled, unlabeled]

# Serialize per-issue so close cannot race ahead of an in-flight open/milestone event.
concurrency:
  group: project-board-sync-${{ github.event.issue.number }}
  cancel-in-progress: false

jobs:
  sync:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Sync issue to Project #5
        uses: actions/github-script@v7
        with:
          # Classic PAT with project + repo scopes (repo secret PROJECT_TOKEN).
          # GITHUB_TOKEN cannot write user-owned Projects.
          github-token: ${{ secrets.PROJECT_TOKEN }}
          script: |
            // Project #5 of user Samuka007 — GraphQL id, verified 2026-10-03.
            // Hardcoded (not looked up by owner/number) so a project rename cannot break routing.
            const PROJECT_ID = 'PVT_kwHOAvgCqs4Blk19';

            const { issue } = context.payload;

            // Lifecycle: closed+wontfix → Canceled, closed → Done,
            // open+ready-for-human → Wait for user (user decision queue),
            // milestoned+open → Todo, milestone-less open → Backlog (Linear default).
            const desiredState = issue.state === 'closed'
              ? (issue.labels?.some((l) => l.name === 'wontfix') ? 'Canceled' : 'Done')
              : (issue.labels?.some((l) => l.name === 'ready-for-human')
                ? 'Wait for user'
                : (issue.milestone ? 'Todo' : 'Backlog'));
            if (!issue.milestone) {
              core.info(`Issue #${issue.number} has no milestone; Status=${desiredState}.`);
            }

            // Priority mirror: priority:p* label is the input surface (visible on
            // the issue page); the board field is canonical for sort/filter.
            // One-way only — no back-sync from field to labels.
            const priorityLabel = issue.labels?.find((l) => /^priority:p[0-2]$/.test(l.name));
            const desiredPriority = priorityLabel
              ? priorityLabel.name.split(':')[1].toUpperCase()
              : null;

            // Resolve the Status + Priority single-select fields + option ids at runtime.
            const { node: project } = await github.graphql(
              `query($id: ID!) {
                node(id: $id) {
                  ... on ProjectV2 {
                    fields(first: 20) {
                      nodes {
                        ... on ProjectV2SingleSelectField {
                          id
                          name
                          options { id name }
                        }
                      }
                    }
                  }
                }
              }`,
              { id: PROJECT_ID },
            );
            const singleSelects = project.fields.nodes.filter(Boolean);
            const statusField = singleSelects.find((f) => f.name === 'Status');
            const priorityField = singleSelects.find((f) => f.name === 'Priority');
            if (!statusField) throw new Error('Status field not found on project');
            const option = statusField.options.find((o) => o.name === desiredState);
            if (!option) throw new Error(`Status option "${desiredState}" not found on project`);

            // Reuse the existing item when the issue is already on the board.
            const { repository } = await github.graphql(
              `query($owner: String!, $repo: String!, $number: Int!) {
                repository(owner: $owner, name: $repo) {
                  issue(number: $number) {
                    projectItems(first: 100) {
                      nodes { id project { id } }
                    }
                  }
                }
              }`,
              {
                owner: context.repo.owner,
                repo: context.repo.repo,
                number: issue.number,
              },
            );
            let itemId = repository.issue.projectItems.nodes.find(
              (n) => n.project.id === PROJECT_ID,
            )?.id;

            if (itemId) {
              core.info(`Issue #${issue.number} already on project as item ${itemId}`);
            } else {
              const { addProjectV2ItemById } = await github.graphql(
                `mutation($projectId: ID!, $contentId: ID!) {
                  addProjectV2ItemById(input: { projectId: $projectId, contentId: $contentId }) {
                    item { id }
                  }
                }`,
                { projectId: PROJECT_ID, contentId: issue.node_id },
              );
              itemId = addProjectV2ItemById.item.id;
              core.info(`Added issue #${issue.number} to project as item ${itemId}`);
            }

            const setFieldValue = (fieldId, optionId) => github.graphql(
              `mutation($projectId: ID!, $itemId: ID!, $fieldId: ID!, $optionId: String!) {
                updateProjectV2ItemFieldValue(
                  input: {
                    projectId: $projectId
                    itemId: $itemId
                    fieldId: $fieldId
                    value: { singleSelectOptionId: $optionId }
                  }
                ) {
                  projectV2Item { id }
                }
              }`,
              {
                projectId: PROJECT_ID,
                itemId,
                fieldId,
                optionId,
              },
            );
            await setFieldValue(statusField.id, option.id);
            core.info(`Set Status=${desiredState} for issue #${issue.number}`);

            // Mirror Priority (skip silently if the field was never configured).
            if (priorityField) {
              const priorityOption = desiredPriority
                ? priorityField.options.find((o) => o.name === desiredPriority)
                : null;
              if (desiredPriority && !priorityOption) {
                core.warning(`Priority option "${desiredPriority}" not found on project; mirror skipped.`);
              } else if (priorityOption) {
                await setFieldValue(priorityField.id, priorityOption.id);
                core.info(`Set Priority=${desiredPriority} for issue #${issue.number}`);
              } else {
                // No priority label → clear the mirror (labels drive).
                await github.graphql(
                  `mutation($projectId: ID!, $itemId: ID!, $fieldId: ID!) {
                    clearProjectV2ItemFieldValue(
                      input: { projectId: $projectId, itemId: $itemId, fieldId: $fieldId }
                    ) {
                      projectV2Item { id }
                    }
                  }`,
                  {
                    projectId: PROJECT_ID,
                    itemId,
                    fieldId: priorityField.id,
                  },
                );
                core.info(`Cleared Priority for issue #${issue.number} (no priority label).`);
              }
            }
